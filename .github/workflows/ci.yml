# CI: on every push to main and every pull request, check the backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # the workflow can only read the code

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest
