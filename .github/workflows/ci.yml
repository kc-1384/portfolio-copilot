# CI: on every push to main and every pull request, check the backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # the workflow can only read the code

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway database just for this CI run (same image as infra/docker-compose.yml).
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings for the app and tests (there is no .env file in CI).
    env:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: copilot
      POSTGRES_HOST: 127.0.0.1
      REQUIRE_DB: "1"   # database tests must run here, never be skipped

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest
